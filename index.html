<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase I Proposal Template Builder</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#18343b;background:#f3f6f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:25px}header{background:white;border-bottom:4px solid #16827e}.brand{font-size:30px;font-weight:800;letter-spacing:.5px;color:#146d71}.brand small{display:block;font-size:12px;letter-spacing:3px;color:#677b80}.panel{background:white;border:1px solid #dbe4e5;border-radius:12px;padding:25px;margin:20px 0;box-shadow:0 3px 12px #203d4308}h1{margin:4px 0 0;font-size:27px}h2{font-size:21px;color:#176d70;margin:0 0 17px}h3{font-size:16px;border-bottom:1px solid #dce6e6;padding-bottom:8px;margin-top:26px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-weight:600;font-size:13px}input,select{width:100%;border:1px solid #bccdce;border-radius:7px;padding:10px;font-size:15px;background:white}input[type=checkbox]{width:auto;accent-color:#16827e}button{background:#137a79;color:white;border:0;border-radius:7px;padding:11px 15px;font-weight:bold;cursor:pointer}button.secondary{background:#e6f0f0;color:#125b5c}button:disabled{opacity:.45;cursor:not-allowed}.inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.choice{display:flex;align-items:center;gap:9px;font-size:14px}.muted{color:#62767a;font-size:13px}.warning{color:#c31519;font-weight:900;font-size:20px}.hidden{display:none}.summary{background:#eef7f6;border-radius:9px;padding:18px}.status{white-space:pre-wrap;font-size:14px}.cost{font-size:22px;font-weight:bold}.logo{display:flex;align-items:center;gap:12px}.logo svg{width:48px;height:48px} @media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><header><div class="wrap"><div class="logo"><img src="logo.png" alt="Terraphase Engineering logo" style="max-width:280px;max-height:90px;object-fit:contain" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="brand" style="display:none">TERRAPHASE<small>ENGINEERING</small></div></div><h1>Phase I Proposal Template Builder</h1></div></header><main class="wrap"><section class="panel"><h2>Basic Information</h2><p class="muted">Entries are saved automatically in this browser. Generate a completed Word proposal using the embedded template.</p>
<div class="grid">
<div class="field"><label>Originating office</label><select id="office"></select></div>
<div class="field"><label>Is this a new client?</label><select id="newClient"><option value="0">No</option><option value="1">Yes</option></select></div>
<div class="field full"><label>Client lookup — Description</label><div class="inline"><input id="clientQuery" placeholder="Search client name" style="flex:1"><button type="button" id="clientSearch">Search client list</button></div><div id="clientResults" class="status"></div></div>
<div class="field"><label>Proposal date</label><div class="inline"><input id="date" style="flex:1" placeholder="October 29, 2026"><button type="button" class="secondary" id="today">Today</button></div></div>
<div class="field"><label>Honorific</label><select id="honorific"><option>Mr.</option><option>Ms.</option><option>Mrs.</option><option selected>[INSERT]</option></select></div>
<div class="field"><label>Recipient first name</label><input id="recipientFirst"></div><div class="field"><label>Recipient last name</label><input id="recipientLast"></div>
<div class="field"><label>Recipient title</label><input id="recipientTitle"></div><div class="field"><label>Recipient company</label><input id="recipientCompany"></div>
<div class="field"><label>Recipient address</label><input id="recipientAddress"></div><div class="field"><label>Recipient city, state ZIP</label><input id="recipientCityStateZip"></div>
<div class="field full"><label>Recipient email</label><input id="email" type="email"></div>
<div class="field full"><label>Site parcel number(s) — APNs</label><div id="apns"></div><button type="button" class="secondary" id="addApn">+ Add another APN</button></div>
<div class="field"><label>Parcel shape</label><select id="shape"><option>square</option><option>rectangular</option><option>pie-shaped</option><option>irregular</option><option>[OTHER]</option></select></div>
<div class="field"><label>Current property use</label><select id="use"><option>in use as a retail store</option><option>in use for industrial purposes</option><option>vacant and undeveloped</option><option>vacant with developed structures</option><option>in use as utility infrastructure</option><option>in use as an office building</option><option>in use as multi-family residential</option><option>in use as a single-family residence</option><option>in use as single family residences</option><option>OTHER</option></select></div>
<div class="field"><label>Current use since (date)</label><input id="dateSince"></div><div class="field"><label>Current tenant</label><input id="tenant"></div>
<div class="field"><label>Site address</label><input id="siteAddress"></div><div class="field"><label>Site city</label><input id="siteCity"></div>
<div class="field"><label>Site county</label><input id="siteCounty"></div><div class="field"><label>Site state</label><input id="siteState" value="California"></div>
<div class="field"><label>Site acreage</label><input id="acre" type="number" step="any"></div><div class="field"><label>Purpose of Phase I</label><select id="reason"><option>purchase</option><option>refinance</option><option>sale</option><option>acquisition of an easement</option><option>redevelopment</option><option>OTHER</option></select></div>
<div class="field"><label>School district, not used for K–12 instruction?</label><select id="school"><option value="0">No</option><option value="1">Yes</option></select></div>
<div class="field"><label>Lien/AUL report required under contract?</label><select id="lienRequired"><option value="0">No</option><option value="1">Yes</option></select></div>
<div class="field"><label>Weeks after site reconnaissance (standard: 4)</label><input id="weeks" type="number" value="4" min="0"></div><div class="field"><label>In-person records review required?</label><select id="inPerson"><option value="0">No</option><option value="1">Yes</option></select></div>
<div class="field"><label>Weeks for legal access (standard: 2)</label><input id="legalAccess" type="number" value="2" min="0"></div><div class="field"><label>Terraphase contact</label><input id="contact"></div>
<div class="field"><label>Terraphase contact title</label><input id="contactTitle"></div><div class="field"><label>Terraphase contact phone</label><input id="phone"></div>
<div class="field"><label>Terraphase contact extension</label><input id="extension"></div><div class="field"><label>D/D principal name</label><input id="principal"></div>
<div class="field"><label>D/D principal title</label><input id="principalTitle"></div>
</div></section>
<section class="panel"><h2>Price Builder</h2><div class="grid">
<div class="field"><label>Base cost ($)</label><input id="baseCost" type="number" min="0" step=".01" value="6500"></div><div class="field"><label>Additional parcel AUL reports ($100 each)</label><input id="aul" type="number" min="0" value="0"></div>
<div class="field"><label>Site walk billing rate</label><select id="walkType"></select></div><div class="field"><label>Additional driving hours beyond 3</label><input id="drive" type="number" min="0" step=".25" value="0"></div>
<div class="field"><label>Abnormally many nearby cleanup/investigation sites?</label><select id="complex"><option value="0">No</option><option value="1">Yes (+$1,000)</option></select></div><div class="field"><label>Extra site reconnaissance hours beyond 3</label><input id="walkExtra" type="number" min="0" step=".25" value="0"></div>
<div class="field"><label>Expedited drafting by associate or above?</label><select id="draftExtra"><option value="0">No</option><option value="1">Yes (+$1,000)</option></select></div>
<div class="field"><label>Strategic support services needed?</label><select id="ss"><option value="0">No</option><option value="1">Yes</option></select></div>
<div class="field"><label>Strategic support services cost ($)</label><input id="ssCost" type="number" value="1875" min="0" step=".01" disabled></div>
<div class="field"><label>TOTAL COST ($) — editable override</label><input id="totalCost" class="cost" type="number" min="0" step=".01"></div>
<div class="full"><div id="approval" class="warning hidden">THIS COST REQUIRES BUY-OFF BY PRINCIPAL IN CHARGE</div><div class="summary" id="breakdown"></div></div>
</div></section><section class="panel"><div class="inline"><button id="save" type="button">Complete and Save</button><button class="secondary" id="reset" type="button">Clear saved entries</button></div><p id="status" class="status" role="status"></p></section></main>

function apnString(){let a=apns.map(x=>x.trim()).filter(Boolean);return a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a[a.length-1]}
function mapping(){let a=apns.filter(x=>x.trim());let lien=val('lienRequired')==='1'?'Note, a lien and activity use limitation search will be conducted in addition to a review of a title report if available.':'Note, if a title report is not provided for our review, a lien and activity use limitation search will be conducted.';return {
'[new]':val('newClient'),'[Attachments]':(val('newClient')==='1'?(val('ss')==='1'?'Attachments: Master Services Agreement and Rate Schedule':'Attachment: Master Services Agreement'):(val('ss')==='1'?'Attachment: Rate Schedule':'')),'[Date]':val('date'),'[Recipient First Name]':val('recipientFirst'),'[Recipient Last Name]':val('recipientLast'),'[Honorific]':val('honorific'),'[honorific]':val('honorific'),'[Recipient Title]':val('recipientTitle'),'[Recipient Company]':val('recipientCompany'),'[Recipient Address]':val('recipientAddress'),'[Recipient City, State Zip]':val('recipientCityStateZip'),'[emailaddress@email.com]':val('email'),'[APN/s]':a.length===1?'APN':'APNs','[APN #]':apnString(),'[shape]':val('shape'),'[use]':val('use'),'[in use as a retail store]':val('use'),'[date since]':val('dateSince'),'[tenant]':val('tenant'),'[Site Address]':val('siteAddress'),'[Site City]':val('siteCity'),'[Site County]':val('siteCounty'),'[Site State]':val('siteState'),'[acre]':val('acre'),'[reason]':val('reason'),'[lien]':lien,'[weeks]':val('weeks'),'[legal access]':val('legalAccess'),'[Terraphase contact]':val('contact'),'[Terraphase Contact]':val('contact'),'[Title]':val('contactTitle'),'[phone no.]':val('phone'),'[ext]':val('extension'),'[##]':val('extension')?'ext. '+val('extension'):'','[dd princ]':val('principal'),'[princ title]':val('principalTitle'),'[input cost]':money(num('totalCost')),'[base cost]':money(num('baseCost')),'[AUL]':val('aul'),'[aul cost]':money(num('aul')*100),'[drive]':val('drive'),'[SW drive cost]':money(num('drive')*RATES[val('walkType')]),'[complex cost]':money(num('complex')*1000),'[walk extra hours]':val('walkExtra'),'[walk extra cost]':money(num('walkExtra')*RATES[val('walkType')]),'[draft extra]':money(num('draftExtra')*1000),'[site walk type]':val('walkType'),'[SS]':val('ss'),'[SS cost]':money(num('ssCost')),'[ss cost]':money(num('ssCost')),'[Street Address]':val('siteAddress'),'[City]':val('siteCity'),'[County]':val('siteCounty'),'[State]':val('siteState'),'[XXX]':val('recipientCompany')};}
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function textNodes(root){return Array.from(root.getElementsByTagNameNS(W,'t'))}
// Text replacement across Word runs: retains existing formatting and XML structure.
function replaceAcross(root,needle,repl){if(!needle)return;let nodes=textNodes(root);let str=nodes.map(n=>n.textContent).join('');let pos=0;while((pos=str.toLowerCase().indexOf(needle.toLowerCase(),pos))!==-1){let offsets=[],s=0;for(let n of nodes){offsets.push(s);s+=n.textContent.length}let start=nodes.findIndex((n,i)=>offsets[i]<=pos&&pos<offsets[i]+n.textContent.length),end=nodes.findIndex((n,i)=>offsets[i]<pos+needle.length&&pos+needle.length<=offsets[i]+n.textContent.length);if(start<0||end<0)break;let first=nodes[start],last=nodes[end],pre=first.textContent.slice(0,pos-offsets[start]),post=last.textContent.slice(pos+needle.length-offsets[end]);if(start===end)first.textContent=pre+repl+post;else{first.textContent=pre+repl;for(let i=start+1;i<end;i++)nodes[i].textContent='';last.textContent=post}str=nodes.map(n=>n.textContent).join('');pos+=repl.length;if(pos>=str.length)break}}
function removeBetween(root,start,end,keep,period=false){let s=textNodes(root).map(n=>n.textContent).join(''),a=s.toLowerCase().indexOf(start.toLowerCase());if(a<0)return;let b=s.toLowerCase().indexOf(end.toLowerCase(),a+start.length);if(b<0)return;let block=s.slice(a,b+end.length);let inner=block.slice(start.length,block.length-end.length);replaceAcross(root,block,keep?(period?'.':'')+inner:(period?'.':''))}
function fixOffice(root){let sdt=Array.from(root.getElementsByTagNameNS(W,'sdt')).find(e=>e.getElementsByTagNameNS(W,'dropDownList').length);if(!sdt)return;let office=OFFICES.find(x=>x[0]===val('office'));if(!office)return;let content=sdt.getElementsByTagNameNS(W,'sdtContent')[0];if(content){let t=textNodes(content);if(t.length){t[0].textContent=office[1]+'www.terraphase.com';for(let i=1;i<t.length;i++)t[i].textContent=''}}}

function cleanStrategicRows(root){if(val('ss')==='1')return;const rows=Array.from(root.getElementsByTagNameNS(W,'tr'));for(const row of rows){let s=textNodes(row).map(n=>n.textContent).join('').toLowerCase();if(s.includes('optional task')&&s.includes('strategic support'))row.parentNode.removeChild(row)}const tables=Array.from(root.getElementsByTagNameNS(W,'tbl'));for(const table of tables){if(!table.getElementsByTagNameNS(W,'tr').length&&table.parentNode)table.parentNode.removeChild(table)}}
function cleanupVacant(root){if(!/^vacant/i.test(val('use')))return;replaceAcross(root,'and that [tenant] is the current occupant','');replaceAcross(root,'and that '+val('tenant')+' is the current occupant','')}
async function generate(){let status=$('status');status.textContent='Generating proposal…';try{if(!window.JSZip)throw Error('Document processing library could not load. Connect to the internet and retry.');let binary;try{let response=await fetch('proposal_template.zip');if(response.ok){let serverZip=await JSZip.loadAsync(await response.arrayBuffer());let templateFile=Object.keys(serverZip.files).find(n=>/\.docx$/i.test(n));if(templateFile)binary=await serverZip.file(templateFile).async('uint8array')}}catch(e){}if(!binary)binary=Uint8Array.from(atob(TEMPLATE64),c=>c.charCodeAt(0));let zip=await JSZip.loadAsync(binary),m=mapping();let files=Object.keys(zip.files).filter(n=>/^word\/(document|header\d+|footer\d+)\.xml$/.test(n));for(let f of files){let xml=await zip.file(f).async('string'),doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('Invalid template XML: '+f);removeBetween(doc,'[start school]','[end school]',val('school')==='1');removeBetween(doc,'[ip start]','[ip end]',val('inPerson')==='1');removeBetween(doc,'[SS start]','[SS end]',val('ss')==='1',val('ss')!=='1');if(val('ss')==='1'){replaceAcross(doc,'[SS start1]','');replaceAcross(doc,'[SS end2]','')}else{replaceAcross(doc,'[SS start1]','');replaceAcross(doc,'[SS end2]','');cleanStrategicRows(doc)}cleanupVacant(doc);replaceAcross(doc,'Attachments: Master Services Agreement and Rate Schedule','');for(let [k,v] of Object.entries(m))replaceAcross(doc,k,v);if(f.includes('footer'))fixOffice(doc);zip.file(f,new XMLSerializer().serializeToString(doc))}
let blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});let name='Phase_I_Proposal_'+(val('siteCity')||'Draft').replace(/[^a-z0-9_-]/gi,'_')+'.docx';if(window.showSaveFilePicker){try{let handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Word document',accept:{'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx']}}]});let writable=await handle.createWritable();await writable.write(blob);await writable.close();status.textContent='Saved '+name;return}catch(e){if(e.name==='AbortError'){status.textContent='Save canceled.';return}/* fall back to browser download */}}
let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Word proposal generated. Choose a location if your browser prompts for a download destination.'}catch(e){status.textContent='Unable to generate proposal: '+e.message;console.error(e)}}
$('save').onclick=generate;$('reset').onclick=()=>{if(confirm('Clear all saved proposal inputs?')){localStorage.removeItem(storage);location.reload()}};
